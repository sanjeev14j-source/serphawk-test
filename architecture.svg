<svg width="680" height="530" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="530" fill="#ffffff"/>

  <!-- User browser -->
  <rect x="260" y="20" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="340" y="47" text-anchor="middle" font-size="14" fill="#2C2C2A">User browser</text>

  <path d="M340 64 L340 130 L210 130 L210 208" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPC -->
  <rect x="40" y="90" width="600" height="400" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="60" y="118" font-size="14" font-weight="bold" fill="#2C2C2A">AWS VPC</text>
  <text x="60" y="136" font-size="12" fill="#5F5E5A">ap-south-1, default VPC</text>

  <!-- EC2 -->
  <rect x="70" y="150" width="280" height="300" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="90" y="176" font-size="14" font-weight="bold" fill="#0C447C">EC2 instance</text>
  <text x="90" y="194" font-size="12" fill="#185FA5">t3.micro, Docker Compose</text>

  <!-- Frontend -->
  <rect x="90" y="210" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="210" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">Frontend container</text>
  <text x="210" y="250" text-anchor="middle" font-size="12" fill="#534AB7">Next.js, port 3000</text>

  <line x1="210" y1="266" x2="210" y2="280" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="90" y="280" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="210" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">Backend container</text>
  <text x="210" y="320" text-anchor="middle" font-size="12" fill="#993C1D">FastAPI, port 8000</text>

  <path d="M330 308 L365 308 L365 255 L398 255" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RDS -->
  <rect x="400" y="210" width="220" height="90" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="510" y="236" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">RDS PostgreSQL</text>
  <text x="510" y="254" text-anchor="middle" font-size="12" fill="#0F6E56">db.t3.micro, Free Tier</text>
  <text x="510" y="272" text-anchor="middle" font-size="12" fill="#0F6E56">Port 5432</text>
</svg>
